<!--
  Modèle Supabase : Authentication > Email Templates > "Confirm signup"
  Colle ce HTML tel quel dans le champ "Message body" (garde {{ .ConfirmationURL }}).
-->
<div style="background-color:#0d0d3f;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;">
    <tr>
      <td style="background:linear-gradient(135deg,#221f8a,#7a3fe0);border-radius:16px 16px 0 0;padding:28px 32px;text-align:center;">
        <span style="font-size:24px;font-weight:700;color:#f2f0ff;letter-spacing:0.5px;">Gozly</span>
      </td>
    </tr>
    <tr>
      <td style="background:#151250;border-radius:0 0 16px 16px;padding:32px;">
        <h1 style="color:#f2f0ff;font-size:20px;margin:0 0 12px;">Bienvenue sur Gozly !</h1>
        <p style="color:rgba(242,240,255,0.72);font-size:14px;line-height:1.6;margin:0 0 24px;">
          Confirme ton adresse courriel pour activer ton compte et commencer à configurer ton entreprise.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
          <tr>
            <td style="border-radius:10px;background:#7a3fe0;">
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:14px 32px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">
                Confirmer mon compte
              </a>
            </td>
          </tr>
        </table>
        <p style="color:rgba(242,240,255,0.5);font-size:12px;line-height:1.6;margin:28px 0 0;">
          Si le bouton ne fonctionne pas, copie ce lien dans ton navigateur :<br>
          <a href="{{ .ConfirmationURL }}" style="color:#0cc0df;word-break:break-all;">{{ .ConfirmationURL }}</a>
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 8px;text-align:center;">
        <span style="color:rgba(242,240,255,0.4);font-size:12px;">Gozly &middot; gozly.net</span>
      </td>
    </tr>
  </table>
</div>
